<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Usaha AI — Asisten Bisnis buat Kamu | Republik Cuan</title>
<meta name="description" content="Usaha AI, asisten AI khusus urusan bisnis dan usaha. Tanya apa saja soal jualan, keuangan, marketing, sampai ide usaha.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/css/style.css">
<style>
  :root{
    --ua-navy:#0f2a4a;
    --ua-blue:#2f6fed;
    --ua-orange:#f97316;
    --ua-green:#1fae6a;
    --ua-bg:#eef2f7;
    --ua-bubble-ai:#ffffff;
    --ua-bubble-user:#2f6fed;
    --ua-radius:18px;
  }

  *{box-sizing:border-box;}

  body.ua-body{
    margin:0;
    font-family:'Inter',sans-serif;
    background:var(--ua-bg);
    color:var(--ua-navy);
  }

  .ua-shell{
    max-width:820px;
    margin:0 auto;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    background:var(--ua-bg);
  }

  /* Header */
  .ua-header{
    display:flex;
    align-items:center;
    gap:12px;
    padding:14px 18px;
    background:var(--ua-navy);
    color:#fff;
    position:sticky;
    top:0;
    z-index:10;
  }
  .ua-header .ua-avatar{
    width:40px;height:40px;border-radius:50%;
    background:linear-gradient(135deg,var(--ua-green),var(--ua-blue));
    display:flex;align-items:center;justify-content:center;
    font-family:'Sora',sans-serif;font-weight:700;font-size:16px;color:#fff;
    flex-shrink:0;
  }
  .ua-header .ua-title{font-family:'Sora',sans-serif;font-weight:700;font-size:16px;line-height:1.2;}
  .ua-header .ua-status{font-size:12px;color:#9fd6b5;display:flex;align-items:center;gap:6px;}
  .ua-header .ua-status::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--ua-green);display:inline-block;}
  .ua-header a.ua-back{color:#fff;text-decoration:none;font-size:20px;line-height:1;margin-right:2px;}

  /* Quick actions */
  .ua-quick{
    display:flex;
    gap:8px;
    overflow-x:auto;
    padding:12px 14px;
    background:var(--ua-bg);
    border-bottom:1px solid #dfe6ee;
  }
  .ua-quick button{
    flex-shrink:0;
    border:1px solid #cbd6e3;
    background:#fff;
    color:var(--ua-navy);
    font-family:'Inter',sans-serif;
    font-size:13px;
    font-weight:500;
    padding:8px 14px;
    border-radius:999px;
    cursor:pointer;
    transition:background .15s ease, border-color .15s ease;
    white-space:nowrap;
  }
  .ua-quick button:hover{border-color:var(--ua-blue);background:#eef4ff;}

  /* Chat area */
  .ua-chat{
    flex:1;
    padding:18px 14px 10px;
    display:flex;
    flex-direction:column;
    gap:10px;
    overflow-y:auto;
  }

  .ua-msg{
    max-width:78%;
    padding:10px 14px;
    border-radius:var(--ua-radius);
    font-size:14.5px;
    line-height:1.5;
    white-space:pre-wrap;
    word-wrap:break-word;
    animation:ua-pop .15s ease;
  }
  @keyframes ua-pop{from{opacity:0;transform:translateY(4px);}to{opacity:1;transform:translateY(0);}}

  .ua-msg.ai{
    align-self:flex-start;
    background:var(--ua-bubble-ai);
    color:var(--ua-navy);
    border-bottom-left-radius:4px;
    box-shadow:0 1px 2px rgba(15,42,74,.08);
  }
  .ua-msg.user{
    align-self:flex-end;
    background:var(--ua-bubble-user);
    color:#fff;
    border-bottom-right-radius:4px;
  }
  .ua-msg.typing{
    align-self:flex-start;
    background:var(--ua-bubble-ai);
    display:flex;
    gap:4px;
    padding:14px 16px;
  }
  .ua-msg.typing span{
    width:6px;height:6px;border-radius:50%;
    background:#9aa8ba;
    animation:ua-blink 1.2s infinite ease-in-out;
  }
  .ua-msg.typing span:nth-child(2){animation-delay:.2s;}
  .ua-msg.typing span:nth-child(3){animation-delay:.4s;}
  @keyframes ua-blink{0%,80%,100%{opacity:.25;}40%{opacity:1;}}

  /* Input bar */
  .ua-inputbar{
    display:flex;
    align-items:flex-end;
    gap:10px;
    padding:12px 14px;
    background:#fff;
    border-top:1px solid #dfe6ee;
    position:sticky;
    bottom:0;
  }
  .ua-inputbar textarea{
    flex:1;
    resize:none;
    border:1px solid #cbd6e3;
    border-radius:22px;
    padding:11px 16px;
    font-family:'Inter',sans-serif;
    font-size:14.5px;
    max-height:120px;
    line-height:1.4;
    outline:none;
  }
  .ua-inputbar textarea:focus{border-color:var(--ua-blue);}
  .ua-send{
    width:42px;height:42px;border-radius:50%;
    background:var(--ua-green);
    border:none;color:#fff;
    display:flex;align-items:center;justify-content:center;
    cursor:pointer;flex-shrink:0;
    transition:background .15s ease;
  }
  .ua-send:hover{background:#188f57;}
  .ua-send:disabled{background:#b7c3d1;cursor:not-allowed;}

  .ua-disclaimer{
    text-align:center;
    font-size:11px;
    color:#7c8aa0;
    padding:6px 14px 10px;
    font-family:'JetBrains Mono',monospace;
  }

  @media (max-width:640px){
    .ua-msg{max-width:88%;}
  }
</style>
</head>
<body class="ua-body">

<div class="ua-shell">

  <header class="ua-header">
    <a href="../index.html" class="ua-back" aria-label="Kembali ke beranda">←</a>
    <div class="ua-avatar">UA</div>
    <div>
      <div class="ua-title">Usaha AI</div>
      <div class="ua-status">Online — siap bantu usahamu</div>
    </div>
  </header>

  <div class="ua-quick" id="uaQuick">
    <button data-msg="Bikinin caption jualan buat produk saya">Bikinin caption jualan</button>
    <button data-msg="Bantu saya hitung untung usaha saya">Hitung untung usaha</button>
    <button data-msg="Kasih ide promosi murah untuk usaha kecil">Ide promosi murah</button>
    <button data-msg="Bantu saya bikin pesan bales chat pelanggan">Bales chat pelanggan</button>
  </div>

  <main class="ua-chat" id="uaChat">
    <div class="ua-msg ai">Halo! 👋 Saya Usaha AI, siap bantu urusan usahamu — mulai dari ide, jualan, keuangan, sampai jalanin usaha sehari-hari. Usaha kamu bergerak di bidang apa?</div>
  </main>

  <div class="ua-inputbar">
    <textarea id="uaInput" rows="1" placeholder="Tulis pertanyaan soal usahamu..."></textarea>
    <button class="ua-send" id="uaSend" aria-label="Kirim pesan">➤</button>
  </div>
  <div class="ua-disclaimer">Usaha AI hanya menjawab seputar bisnis &amp; usaha</div>

</div>

<script>
(function(){
  const chat = document.getElementById('uaChat');
  const input = document.getElementById('uaInput');
  const sendBtn = document.getElementById('uaSend');
  const quickBar = document.getElementById('uaQuick');

  let history = [];

  function addMessage(role, text){
    const div = document.createElement('div');
    div.className = 'ua-msg ' + (role === 'user' ? 'user' : 'ai');
    div.textContent = text;
    chat.appendChild(div);
    chat.scrollTop = chat.scrollHeight;
    return div;
  }

  function addTyping(){
    const div = document.createElement('div');
    div.className = 'ua-msg typing';
    div.innerHTML = '<span></span><span></span><span></span>';
    chat.appendChild(div);
    chat.scrollTop = chat.scrollHeight;
    return div;
  }

  async function sendMessage(text){
    if(!text.trim()) return;
    addMessage('user', text);
    history.push({ role: 'user', content: text });
    input.value = '';
    input.style.height = 'auto';
    sendBtn.disabled = true;

    const typingEl = addTyping();

    try {
      const res = await fetch('/.netlify/functions/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ messages: history })
      });

      const data = await res.json();
      typingEl.remove();

      if(!res.ok || data.error){
        addMessage('ai', 'Waduh, ada gangguan di server. Coba lagi sebentar ya.');
        console.error(data.error);
      } else {
        addMessage('ai', data.reply);
        history.push({ role: 'assistant', content: data.reply });
      }
    } catch(err){
      typingEl.remove();
      addMessage('ai', 'Koneksi lagi bermasalah. Coba lagi ya.');
      console.error(err);
    } finally {
      sendBtn.disabled = false;
      input.focus();
    }
  }

  sendBtn.addEventListener('click', () => sendMessage(input.value));

  input.addEventListener('keydown', (e) => {
    if(e.key === 'Enter' && !e.shiftKey){
      e.preventDefault();
      sendMessage(input.value);
    }
  });

  input.addEventListener('input', () => {
    input.style.height = 'auto';
    input.style.height = Math.min(input.scrollHeight, 120) + 'px';
  });

  quickBar.addEventListener('click', (e) => {
    const btn = e.target.closest('button[data-msg]');
    if(btn) sendMessage(btn.dataset.msg);
  });
})();
</script>

</body>
</html>
