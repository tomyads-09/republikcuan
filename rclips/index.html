<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>RClips — Video Pendek Seputar Bisnis &amp; Cuan | Republik Cuan</title>
<meta name="description" content="RClips: kumpulan video pendek seputar bisnis sampingan, kerja remote, aplikasi AI, dan kisah sukses. Scroll terus, banyak insight cuan.">
<meta name="robots" content="index, follow">
<link rel="canonical" href="https://republikcuan.web.id/rclips/">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Republik Cuan">
<meta property="og:title" content="RClips — Video Pendek Seputar Bisnis & Cuan">
<meta property="og:description" content="Kumpulan video pendek seputar bisnis sampingan, kerja remote, aplikasi AI, dan kisah sukses.">
<meta property="og:image" content="https://republikcuan.web.id/assets/images/logo.png">
<meta property="og:url" content="https://republikcuan.web.id/rclips/">
<meta name="twitter:card" content="summary_large_image">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" onload="this.onload=null;this.rel='stylesheet'">
<noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap"></noscript>
<link rel="stylesheet" href="../assets/css/style.css">
<style>
  :root{
    --rc-bg:#0A1B33;
    --rc-surface:#0F2748;
    --rc-accent:#FF8A1E;
    --rc-accent-2:#16C265;
    --rc-text:#F5F7FB;
    --rc-text-soft:#B7C2DB;
  }
  html,body{height:100%;overflow:hidden;background:var(--rc-bg);}
  body{margin:0;font-family:var(--font-body, 'Inter', sans-serif);}

  .rc-topbar{
    position:fixed; top:0; left:0; right:0; z-index:40;
    display:flex; align-items:center; gap:12px;
    padding:14px 16px calc(14px + env(safe-area-inset-top, 0px));
    padding-top:calc(14px + env(safe-area-inset-top, 0px));
    background:linear-gradient(180deg, rgba(10,27,51,0.85) 0%, rgba(10,27,51,0) 100%);
    pointer-events:none;
  }
  .rc-topbar a, .rc-topbar span{pointer-events:auto;}
  .rc-back{
    width:36px; height:36px; border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    background:rgba(255,255,255,0.12); color:#fff; text-decoration:none;
    font-size:18px; flex-shrink:0;
  }
  .rc-wordmark{
    font-family:var(--font-display, 'Sora', sans-serif);
    font-weight:800; font-size:19px; color:#fff; letter-spacing:-0.01em;
    line-height:1.1;
  }
  .rc-wordmark em{font-style:normal; color:var(--rc-accent);}
  .rc-wordmark-sub{
    display:block; font-family:var(--font-body, 'Inter', sans-serif);
    font-weight:500; font-size:10.5px; color:var(--rc-text-soft);
    letter-spacing:0.01em; margin-top:1px;
  }

  .rc-feed{
    height:100dvh; height:100vh;
    overflow-y:scroll; scroll-snap-type:y mandatory;
    -webkit-overflow-scrolling:touch;
  }
  .rc-feed::-webkit-scrollbar{display:none;}

  .rc-slide{
    height:100dvh; height:100vh;
    scroll-snap-align:start; scroll-snap-stop:always;
    display:flex; align-items:center; justify-content:center;
    position:relative;
    background:radial-gradient(circle at 50% 20%, #16345F 0%, var(--rc-bg) 70%);
  }

  .rc-player-wrap{
    position:relative;
    width:min(94vw, 420px);
    height:min(78vh, 746px);
    border-radius:18px; overflow:hidden;
    background:#000;
    box-shadow:0 20px 60px rgba(0,0,0,0.45);
  }
  .rc-player-wrap iframe{
    position:absolute; top:0; left:0; width:100%; height:100%; border:0;
  }
  .rc-thumb-fallback{
    position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    background:linear-gradient(160deg, var(--rc-surface), var(--rc-bg));
    color:var(--rc-text-soft); font-size:14px; text-align:center; padding:24px;
  }

  .rc-mute-btn{
    position:absolute; top:14px; right:14px; z-index:5;
    width:38px; height:38px; border-radius:50%; border:none;
    background:rgba(0,0,0,0.45); color:#fff; font-size:16px;
    display:flex; align-items:center; justify-content:center; cursor:pointer;
  }

  .rc-caption-bar{
    position:absolute; left:0; right:0; bottom:0; z-index:5;
    padding:18px 18px calc(18px + env(safe-area-inset-bottom, 0px));
    background:linear-gradient(0deg, rgba(0,0,0,0.75) 0%, rgba(0,0,0,0) 100%);
    color:#fff;
  }
  .rc-cat-pill{
    display:inline-block; padding:4px 10px; border-radius:999px;
    font-size:11px; font-weight:600; margin-bottom:8px;
    background:rgba(255,138,30,0.18); color:var(--rc-accent);
    border:1px solid rgba(255,138,30,0.4);
  }
  .rc-caption{
    font-size:14.5px; line-height:1.45; color:#EFF2F9; margin:0 0 6px;
    max-width:38ch;
  }
  .rc-credit{
    font-size:12px; color:var(--rc-text-soft); margin:0;
  }
  .rc-credit a{color:var(--rc-text-soft);}

  .rc-side-rail{
    position:absolute; right:14px; bottom:110px; z-index:6;
    display:flex; flex-direction:column; align-items:center; gap:18px;
  }
  .rc-rail-btn{
    display:flex; flex-direction:column; align-items:center; gap:4px;
    background:none; border:none; color:#fff; cursor:pointer;
    font-family:inherit;
  }
  .rc-rail-icon{
    width:44px; height:44px; border-radius:50%;
    background:rgba(255,255,255,0.12);
    display:flex; align-items:center; justify-content:center; font-size:19px;
    transition:background 0.15s, transform 0.1s;
  }
  .rc-rail-btn:active .rc-rail-icon{transform:scale(0.9);}
  .rc-rail-btn.active .rc-rail-icon{background:var(--rc-accent); color:#0A1B33;}
  .rc-rail-btn.active-dislike .rc-rail-icon{background:#8B94A8; color:#0A1B33;}
  .rc-rail-label{font-size:10.5px; color:var(--rc-text-soft);}

  .rc-comment-sheet{
    position:fixed; left:0; right:0; bottom:0; z-index:60;
    background:var(--rc-surface); border-radius:18px 18px 0 0;
    max-height:70vh; display:flex; flex-direction:column;
    transform:translateY(100%); transition:transform 0.25s ease;
    box-shadow:0 -10px 40px rgba(0,0,0,0.4);
  }
  .rc-comment-sheet.open{transform:translateY(0);}
  .rc-comment-head{
    display:flex; align-items:center; justify-content:space-between;
    padding:14px 16px; border-bottom:1px solid rgba(255,255,255,0.08);
    color:#fff; font-weight:700; font-family:var(--font-display, 'Sora', sans-serif);
  }
  .rc-comment-close{background:none; border:none; color:var(--rc-text-soft); font-size:20px; cursor:pointer;}
  .rc-comment-list{flex:1; overflow-y:auto; padding:10px 16px;}
  .rc-comment-item{
    padding:9px 0; border-bottom:1px solid rgba(255,255,255,0.06);
    color:#EFF2F9; font-size:13.5px; line-height:1.5;
  }
  .rc-comment-empty{color:var(--rc-text-soft); font-size:13px; text-align:center; padding:24px 0;}
  .rc-comment-form{
    display:flex; gap:8px; padding:12px 16px calc(12px + env(safe-area-inset-bottom, 0px));
    border-top:1px solid rgba(255,255,255,0.08);
  }
  .rc-comment-input{
    flex:1; background:rgba(255,255,255,0.08); border:1px solid rgba(255,255,255,0.14);
    border-radius:999px; padding:9px 14px; color:#fff; font-size:13.5px; font-family:inherit;
  }
  .rc-comment-input::placeholder{color:var(--rc-text-soft);}
  .rc-comment-send{
    background:var(--rc-accent); color:#0A1B33; border:none; border-radius:999px;
    padding:9px 16px; font-weight:700; font-size:13px; cursor:pointer; font-family:inherit;
  }
  .rc-comment-website{position:absolute; left:-9999px; width:1px; height:1px; opacity:0;}
  .rc-sheet-backdrop{
    position:fixed; inset:0; z-index:59; background:rgba(0,0,0,0.5);
    opacity:0; pointer-events:none; transition:opacity 0.25s ease;
  }
  .rc-sheet-backdrop.open{opacity:1; pointer-events:auto;}

  .rc-progress{
    position:fixed; top:0; left:0; right:0; height:2.5px; z-index:41;
    display:flex; gap:3px; padding:0 8px;
    padding-top:calc(0px + env(safe-area-inset-top, 0px));
  }
  .rc-progress i{
    flex:1; height:100%; border-radius:2px; background:rgba(255,255,255,0.22);
  }
  .rc-progress i.active{background:var(--rc-accent);}

  .rc-empty{
    color:var(--rc-text-soft); text-align:center; padding:40px; max-width:320px;
    font-size:14px; line-height:1.6;
  }
  .rc-empty a{color:var(--rc-accent);}

  @media (min-width:900px){
    .rc-player-wrap{height:min(84vh, 800px);}
  }
</style>
</head>
<body>

<div class="rc-progress" id="rcProgress"></div>

<div class="rc-topbar">
  <a href="../index.html" class="rc-back" aria-label="Kembali ke beranda">←</a>
  <span class="rc-wordmark">RCl<em>ip</em>s<span class="rc-wordmark-sub">Short video from YouTube</span></span>
</div>

<div class="rc-sheet-backdrop" id="rcBackdrop"></div>
<main class="rc-feed" id="rcFeed" aria-label="Feed video pendek RClips"></main>

<template id="rc-slide-template">
  <section class="rc-slide" data-video-id="">
    <div class="rc-player-wrap">
      <div class="rc-thumb-fallback">Video sedang dimuat…</div>
      <button class="rc-mute-btn" aria-label="Nyalakan/matikan suara">🔇</button>
    </div>
    <div class="rc-side-rail">
      <button class="rc-rail-btn rc-like" aria-label="Suka">
        <span class="rc-rail-icon">👍</span>
        <span class="rc-rail-label rc-like-count">0</span>
      </button>
      <button class="rc-rail-btn rc-dislike" aria-label="Tidak suka">
        <span class="rc-rail-icon">👎</span>
        <span class="rc-rail-label rc-dislike-count">0</span>
      </button>
      <button class="rc-rail-btn rc-comment-btn" aria-label="Komentar">
        <span class="rc-rail-icon">💬</span>
        <span class="rc-rail-label rc-comment-count">0</span>
      </button>
      <button class="rc-rail-btn rc-share" aria-label="Bagikan">
        <span class="rc-rail-icon">↗</span>
        <span class="rc-rail-label">Bagikan</span>
      </button>
    </div>
    <div class="rc-caption-bar">
      <span class="rc-cat-pill"></span>
      <p class="rc-caption"></p>
      <p class="rc-credit"></p>
    </div>
  </section>
</template>

<div class="rc-comment-sheet" id="rcCommentSheet">
  <div class="rc-comment-head">
    <span>Komentar</span>
    <button class="rc-comment-close" id="rcCommentClose" aria-label="Tutup">✕</button>
  </div>
  <div class="rc-comment-list" id="rcCommentList"></div>
  <form class="rc-comment-form" id="rcCommentForm">
    <input type="text" class="rc-comment-website" id="rcWebsiteHoneypot" tabindex="-1" autocomplete="off" placeholder="Jangan diisi">
    <input type="text" class="rc-comment-input" id="rcCommentInput" placeholder="Tulis komentar…" maxlength="280">
    <button type="submit" class="rc-comment-send">Kirim</button>
  </form>
</div>

<script src="videos_data.js"></script>
<script>
(function(){
  const feed = document.getElementById('rcFeed');
  const tpl = document.getElementById('rc-slide-template');
  const progressBar = document.getElementById('rcProgress');
  const videos = (typeof RCLIPS_VIDEOS !== 'undefined') ? RCLIPS_VIDEOS : [];

  if (!videos.length) {
    feed.innerHTML = '<div class="rc-slide"><div class="rc-empty">Belum ada video di sini. Tambahin video pertama kamu lewat file <code>rclips/videos_data.js</code>. <br><br><a href="../index.html">← Kembali ke beranda</a></div></div>';
    return;
  }

  const API = '/.netlify/functions/rclips-react';
  const REACT_KEY = 'rclips_reactions'; // localStorage: {videoId: 'like'|'dislike'}
  function getLocalReactions(){
    try { return JSON.parse(localStorage.getItem(REACT_KEY) || '{}'); } catch(e) { return {}; }
  }
  function setLocalReaction(videoId, val){
    try {
      const r = getLocalReactions();
      if (val) r[videoId] = val; else delete r[videoId];
      localStorage.setItem(REACT_KEY, JSON.stringify(r));
    } catch(e) {}
  }

  let userMuted = true;
  let commentSheetVideoId = null;
  const commentSheet = document.getElementById('rcCommentSheet');
  const commentBackdrop = document.getElementById('rcBackdrop');
  const commentList = document.getElementById('rcCommentList');
  const commentForm = document.getElementById('rcCommentForm');
  const commentInput = document.getElementById('rcCommentInput');
  const commentHoneypot = document.getElementById('rcWebsiteHoneypot');

  function openCommentSheet(videoId, comments){
    commentSheetVideoId = videoId;
    renderComments(comments || []);
    commentSheet.classList.add('open');
    commentBackdrop.classList.add('open');
  }
  function closeCommentSheet(){
    commentSheet.classList.remove('open');
    commentBackdrop.classList.remove('open');
    commentSheetVideoId = null;
  }
  document.getElementById('rcCommentClose').addEventListener('click', closeCommentSheet);
  commentBackdrop.addEventListener('click', closeCommentSheet);

  function renderComments(comments){
    if (!comments.length) {
      commentList.innerHTML = '<div class="rc-comment-empty">Belum ada komentar. Jadi yang pertama!</div>';
      return;
    }
    commentList.innerHTML = '';
    comments.forEach(c => {
      const div = document.createElement('div');
      div.className = 'rc-comment-item';
      div.textContent = c.text; // textContent = aman dari HTML/script injection
      commentList.appendChild(div);
    });
  }

  commentForm.addEventListener('submit', async (e) => {
    e.preventDefault();
    const text = commentInput.value.trim();
    if (!text || !commentSheetVideoId) return;
    commentInput.value = '';
    try {
      const res = await fetch(API, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ videoId: commentSheetVideoId, action: 'comment', text, website: commentHoneypot.value })
      });
      const data = await res.json();
      if (data.comments) {
        renderComments(data.comments);
        const slide = feed.querySelector(`.rc-slide[data-video-id="${commentSheetVideoId}"]`);
        if (slide) slide.querySelector('.rc-comment-count').textContent = data.comments.length;
      }
    } catch(e) { console.error('Gagal kirim komentar:', e); }
  });

  videos.forEach((v, idx) => {
    const node = tpl.content.cloneNode(true);
    const slide = node.querySelector('.rc-slide');
    slide.dataset.videoId = v.id;
    slide.dataset.index = idx;
    node.querySelector('.rc-cat-pill').textContent = v.category || 'RClips';
    node.querySelector('.rc-caption').textContent = v.caption || '';
    node.querySelector('.rc-credit').textContent = v.credit || 'Sumber: YouTube';

    const likeBtn = node.querySelector('.rc-like');
    const dislikeBtn = node.querySelector('.rc-dislike');
    const localReaction = getLocalReactions()[v.id];
    if (localReaction === 'like') likeBtn.classList.add('active');
    if (localReaction === 'dislike') dislikeBtn.classList.add('active-dislike');

    likeBtn.addEventListener('click', () => reactTo(v.id, 'like', slide));
    dislikeBtn.addEventListener('click', () => reactTo(v.id, 'dislike', slide));

    node.querySelector('.rc-comment-btn').addEventListener('click', async () => {
      openCommentSheet(v.id, []);
      try {
        const res = await fetch(`${API}?videoId=${encodeURIComponent(v.id)}`);
        const data = await res.json();
        if (commentSheetVideoId === v.id) renderComments(data.comments || []);
      } catch(e) { console.error('Gagal ambil komentar:', e); }
    });

    node.querySelector('.rc-share').addEventListener('click', async () => {
      const url = location.origin + location.pathname + '#' + v.id;
      if (navigator.share) {
        try { await navigator.share({ title: 'RClips — Republik Cuan', url }); } catch(e) {}
      } else {
        try { await navigator.clipboard.writeText(url); alert('Link disalin! Bisa langsung ditempel ke status Facebook / WhatsApp.'); } catch(e) {}
      }
    });
    node.querySelector('.rc-mute-btn').addEventListener('click', (e) => {
      userMuted = !userMuted;
      e.currentTarget.textContent = userMuted ? '🔇' : '🔊';
      const iframe = slide.querySelector('iframe');
      if (iframe) loadOrUpdateIframe(slide, v.id, true);
    });
    feed.appendChild(node);

    // muat statistik like/dislike/comment count awal
    fetch(`${API}?videoId=${encodeURIComponent(v.id)}`)
      .then(r => r.json())
      .then(data => {
        slide.querySelector('.rc-like-count').textContent = data.likes || 0;
        slide.querySelector('.rc-dislike-count').textContent = data.dislikes || 0;
        slide.querySelector('.rc-comment-count').textContent = (data.comments || []).length;
      })
      .catch(() => {});
  });

  async function reactTo(videoId, type, slide){
    const current = getLocalReactions()[videoId]; // 'like' | 'dislike' | undefined
    const likeBtn = slide.querySelector('.rc-like');
    const dislikeBtn = slide.querySelector('.rc-dislike');
    const likeCountEl = slide.querySelector('.rc-like-count');
    const dislikeCountEl = slide.querySelector('.rc-dislike-count');

    let action;
    let nextState;
    if (current === type) {
      // klik ulang -> batalkan reaksi
      action = type === 'like' ? 'unlike' : 'undislike';
      nextState = null;
    } else {
      action = type;
      nextState = type;
      // kalau sebelumnya reaksi beda (like->dislike / sebaliknya), batalkan yang lama dulu
      if (current) {
        await postReaction(videoId, current === 'like' ? 'unlike' : 'undislike');
      }
    }

    setLocalReaction(videoId, nextState);
    likeBtn.classList.toggle('active', nextState === 'like');
    dislikeBtn.classList.toggle('active-dislike', nextState === 'dislike');

    const data = await postReaction(videoId, action);
    if (data) {
      likeCountEl.textContent = data.likes || 0;
      dislikeCountEl.textContent = data.dislikes || 0;
    }
  }

  async function postReaction(videoId, action){
    try {
      const res = await fetch(API, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ videoId, action })
      });
      return await res.json();
    } catch(e) {
      console.error('Gagal kirim reaksi:', e);
      return null;
    }
  }

  // progress dots
  videos.forEach((_, i) => {
    const dot = document.createElement('i');
    if (i === 0) dot.classList.add('active');
    progressBar.appendChild(dot);
  });

  function loadOrUpdateIframe(slide, id, forceReload){
    const wrap = slide.querySelector('.rc-player-wrap');
    let iframe = wrap.querySelector('iframe');
    const fallback = wrap.querySelector('.rc-thumb-fallback');
    const muteParam = userMuted ? 1 : 0;
    const src = `https://www.youtube.com/embed/${id}?autoplay=1&mute=${muteParam}&playsinline=1&loop=1&playlist=${id}&controls=0&modestbranding=1&rel=0`;
    if (!iframe) {
      iframe = document.createElement('iframe');
      iframe.setAttribute('allow', 'autoplay; encrypted-media; picture-in-picture');
      iframe.setAttribute('allowfullscreen', '');
      iframe.setAttribute('loading', 'lazy');
      wrap.insertBefore(iframe, wrap.firstChild);
      if (fallback) fallback.remove();
    }
    if (forceReload || iframe.src !== src) iframe.src = src;
  }

  function pauseSlide(slide){
    const iframe = slide.querySelector('iframe');
    if (iframe) iframe.src = 'about:blank';
  }

  const slides = Array.from(feed.querySelectorAll('.rc-slide'));
  const dots = Array.from(progressBar.children);

  const io = new IntersectionObserver((entries) => {
    entries.forEach(entry => {
      const slide = entry.target;
      const idx = Number(slide.dataset.index);
      if (entry.isIntersecting && entry.intersectionRatio > 0.6) {
        loadOrUpdateIframe(slide, slide.dataset.videoId, false);
        dots.forEach((d, i) => d.classList.toggle('active', i === idx));
        slides.forEach(s => { if (s !== slide) pauseSlide(s); });
      }
    });
  }, { threshold: [0, 0.6, 1] });

  slides.forEach(s => io.observe(s));
})();
</script>

</body>
</html>
