[build]
  command = "npm install"
  publish = "."

[functions]
  directory = "netlify/functions"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"

# --- Tutup halaman duplikat & file internal agar tidak terindeks / dibaca publik ---
[[redirects]]
  from = "/mnt/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/assets/layanan/*"
  to = "/layanan/:splat"
  status = 301
  force = true

[[redirects]]
  from = "/gen_articles.py"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/CHANGELOG-UPDATE.md"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/PANDUAN-SETUP.md"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/README.md"
  to = "/404.html"
  status = 404
  force = true

# --- RC News 24 sudah dihapus: alihkan alamat lama ke beranda ---
[[redirects]]
  from = "/rc-news-24.html"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/rc-news-24"
  to = "/"
  status = 301
  force = true

# --- Satukan URL: alamat tanpa .html dialihkan (301) ke versi .html yang menjadi canonical ---
